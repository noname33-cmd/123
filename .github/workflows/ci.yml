name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-local-ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm test:scripts
      - run: pnpm test:database
      - name: Start infrastructure
        env:
          POSTGRES_PASSWORD: ci-local-ephemeral
        run: pnpm infra:up
      - run: pnpm test:infra
      - if: always()
        env:
          POSTGRES_PASSWORD: ci-local-ephemeral
        run: pnpm infra:down
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - run: sdkmanager 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @truck/navigation --filter @truck/truck-profile build
      - name: Create local debug key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - working-directory: apps/mobile/android
        run: bash gradlew resolveDependencyLocks assembleDebug -PreactNativeArchitectures=x86_64 --max-workers=2 --no-daemon
      - name: Reject missing dependency lock state
        working-directory: apps/mobile/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/android-locks"
          LOG="$GITHUB_WORKSPACE/artifacts/android-locks/missing-lock.log"
          if bash gradlew :app:resolveDependencyLocks -I ../../../scripts/gradle-missing-lock.init.gradle --offline -PreactNativeArchitectures=x86_64 --max-workers=2 --no-daemon > "$LOG" 2>&1; then
            cat "$LOG"
            echo 'Expected strict locking to reject absent state'
            exit 1
          fi
          grep -F 'does not have lock state' "$LOG"
      - name: Verify lockfiles are unchanged
        run: git diff --exit-code -- apps/mobile/android/buildscript-gradle.lockfile apps/mobile/android/gradle/dependency-locks
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-x86_64
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Start Metro
        run: |
          mkdir -p artifacts
          (cd apps/mobile && pnpm start --no-interactive --max-workers 2 > ../../artifacts/metro.log 2>&1) &
      - name: Wait for Metro and prepare Android bundle
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused --max-time 5 http://127.0.0.1:8081/status | grep -Fx 'packager-status:running'
          curl --fail --silent --show-error --max-time 180 'http://127.0.0.1:8081/index.bundle?platform=android&dev=true&lazy=false&minify=false&app=com.truckroutesavings&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server' --output /dev/null
          curl --fail --silent --show-error --max-time 60 'http://127.0.0.1:8081/index.bundle?platform=android&dev=true&lazy=true&minify=false&app=com.truckroutesavings&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server' --output /dev/null
      - name: Enable KVM for runner user
        run: |
          sudo chown "$USER" /dev/kvm
          sudo chmod 600 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          pre-emulator-launch-script: |
            python3 - <<'PY'
            from pathlib import Path
            import re
            config = Path.home() / '.android/avd/test.avd/config.ini'
            text = config.read_text()
            for key, value in {'hw.lcd.width': '720', 'hw.lcd.height': '1600', 'hw.lcd.density': '280'}.items():
                text = re.sub(r'^' + re.escape(key) + r'\s*=.*\n?', '', text, flags=re.MULTILINE)
                text += f'\n{key}={value}\n'
            config.write_text(text)
            PY
          emulator-port: 5554
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: ANDROID_SERIAL=emulator-5554 ANDROID_APK_PATH="$GITHUB_WORKSPACE/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" pnpm test:android
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: artifacts/
          if-no-files-found: warn
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUNDLE_FROZEN: 'true'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @truck/navigation --filter @truck/truck-profile build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler: '2.5.22'
          working-directory: apps/mobile
          bundler-cache: true
      - working-directory: apps/mobile/ios
        run: bundle exec pod install --deployment
      - working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace TruckRouteSavings.xcworkspace -scheme TruckRouteSavings -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Create isolated iOS simulator
        run: |
          UDID=$(xcrun simctl create TruckFoundationSmoke com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: iOS launch and UI smoke
        run: |
          set -o pipefail
          mkdir -p artifacts/ios-smoke
          pnpm test:ios 2>&1 | tee artifacts/ios-smoke/xctest.log
      - if: always() && env.IOS_SIMULATOR_UDID != ''
        name: Remove CI simulator
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID" || true
          xcrun simctl delete "$IOS_SIMULATOR_UDID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            apps/mobile/ios/Podfile.lock
            apps/mobile/ios/xcodebuild.log
            artifacts/ios-smoke/
          if-no-files-found: warn
