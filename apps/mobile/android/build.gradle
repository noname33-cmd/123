buildscript {
    if (!gradle.startParameter.writeDependencyLocks && !file('buildscript-gradle.lockfile').isFile()) {
        throw new GradleException('Missing buildscript-gradle.lockfile; generate dependency locks intentionally with --write-locks')
    }
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

apply from: 'gradle/dependency-locking.gradle'
